name: Android tests
# The Kotlin of android/: built as a library against Capacitor's Android project from node_modules, and its JVM unit tests
# (JUnit, no emulator) extracting the archives in test/fixtures. Called by ci.yaml when something it covers changes, and for every
# push to main.
on:
  workflow_call:
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      # Capacitor 8's Android project compiles for Java 21
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1
      # settings.gradle takes :capacitor-android from node_modules/@capacitor/android
      - run: npm ci
      - run: npm run verify:android
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-tests
          path: android/build/reports/tests
          if-no-files-found: ignore
